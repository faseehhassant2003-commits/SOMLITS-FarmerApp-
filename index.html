:root{

  --flag:#2F7BD8; --flag-soft:#DCE9FA; --navy:#14305E; --sand:#C98A2B; --sand-soft:#F6E6CC;
  --ok:#1E7A4C; --ok-soft:#DDF1E6; --warn:#A86200; --warn-soft:#FBEBD2; --bad:#B23A3A; --bad-soft:#F8DEDE;

}

:root[data-theme="dark"]{

*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding-block:28px 80px}
.head{display:flex;flex-direction:column;gap:14px;padding-bottom:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;color:var(--ink)}
h1{font-size:clamp(32px,4.6vw,50px);line-height:1.04;font-weight:800;letter-spacing:-.02em}
h2{font-size:28px;font-weight:700;letter-spacing:-.01em}
h3{font-size:18px;font-weight:700}
p{margin:0;max-width:70ch}
.eyebrow{font:600 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--flag)}
.lead{font-size:18px;color:var(--muted);max-width:66ch}
.mono{font-family:var(--f-mono);font-size:.86em}
code{font-family:var(--f-mono);font-size:.85em;background:var(--sunk);padding:1px 5px;border-radius:4px}

.panel{min-width:0;display:flex;flex-direction:column;gap:60px}
section{display:flex;flex-direction:column;gap:20px;scroll-margin-top:90px}
.phead{display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.facts div{background:var(--surface);padding:13px 15px;display:flex;flex-direction:column;gap:4px}
.facts b{font:600 11px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.facts span{font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.links button{appearance:none;font:600 12.5px/1 var(--f-mono);padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--flag);cursor:pointer}
.links button:hover{background:var(--flag-soft)}
/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:660px}
th,td{text-align:left;padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font:600 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
td .mono{white-space:nowrap}
tbody tr:hover td{background:color-mix(in srgb,var(--flag-soft) 40%,transparent)}
.pill{display:inline-block;font:600 11px/1 var(--f-mono);padding:4px 7px;border-radius:5px;white-space:nowrap}
.p-onp{background:var(--flag-soft);color:var(--navy)} .p-az{background:var(--sand-soft);color:var(--sand)} .p-dev{background:var(--ok-soft);color:var(--ok)}
.p-m{background:var(--bad-soft);color:var(--bad)} .p-o{background:var(--sunk);color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.box ul{margin:0;padding-left:18px;font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.muted{color:var(--muted);font-size:14px}
/* from main/index.html line 5451 */
.rt-chip{border:1px solid var(--line);background:var(--surface);color:var(--flag);border-radius:5px;padding:2px 6px;font:600 11px/1.5 var(--f-mono);cursor:pointer}
/* Standalone only: same content width as the Farmer panel in the original page (1240px wrap - 210px rail - 44px gap) */
.wrap{max-width:986px}

restrict:{g:'Main',t:'Herd under restriction (T-F1)',m:'FR-M10-05 · FR-M11-01',n:'Shown when the herder’s premises falls inside a zone. Sell and move are blocked until it is lifted.',h:()=>top('Standstill')+`<div class="fp-body"><div class="fp-hero r">${ic('lock',28)}<b>Your herd cannot move or be sold</b><small>Buuloburde surveillance zone · until 20 Nov</small></div><div class="fp-tl">${[['Do not move animals out of the zone','Checkpoints will refuse them'],['Report any sick animal at once','Free vet visit'],['Ring vaccination team arrives 2 Nov','Keep animals at the camp']].map(x=>`<div><i></i><span><b>${x[0]}</b><small>${x[1]}</small></span></div>`).join('')}</div>${btn('Report a sick animal','report')}${btn('Call the vet','help','o')}</div>`},
askreg:{g:'Requests',t:'Ask to register animals (F10)',m:'FR-M03-13 · FR-M02-21',n:'Herders can list untagged animals; they stay pending until an officer tags and verifies them.',h:()=>top('Register animals')+`<div class="fp-body"><label class="fp-l">Species</label><div class="fp-chips">${['Camel','Cattle','Goat','Sheep'].map((c,i)=>`<button class="${i===2?'on':''}">${c}</button>`).join('')}</div>${f('How many','14')}${f('Where are they','Xiintoole camp · 0700405')}<label class="fp-l">Already tagged?</label><div class="fp-seg"><span>Yes</span><span class="on">No</span></div><div class="fp-note">An officer will visit to tag and confirm. Until then they show as Pending.</div>${btn('Send request','reqs')}</div>`},

papers:{g:'Records',t:'My papers (F12)',m:'FR-M11-03 · FR-M09-01 · FR-M05-05 · FR-M04-09',n:'Owner card, premises certificates, permits and the vaccination card, each with a QR an officer or buyer can scan offline.',h:()=>top(t('papers'))+`<div class="fp-body">${[['user','Owner card','SL-07-0045128',1,'g','Valid'],['pin','Premises certificate','PIN 0700405 · Homestead',2,'g','Valid'],['pin','Premises certificate','PIN 0700412 · Dry-season camp',4,'g','Valid'],['truck','Movement permit','MP-07-2026-001204 · 6–9 Nov',5,'y','Waiting'],['syr','Vaccination card','141 animals · last PPR 12 Oct',6,'g','Valid'],['truck','Movement permit','MP-07-2026-001188 · expired 2 Oct',3,'m','Expired']].map(x=>`<button class="fp-row" data-paper="${x[3]}"><span class="fp-ri">${ic(x[0])}</span><span class="fp-rt"><b>${x[1]}</b><small class="mono">${x[2]}</small></span><span class="fp-pill fp-${x[4]}">${x[5]}</span></button>`).join('')}${S.paper?`<div class="fp-card c">${qr(S.paper*13+5)}<b>${['','Owner card','Premises certificate','Movement permit','Premises certificate','Movement permit','Vaccination card'][S.paper]}</b><small class="fp-mut">Signed by MoLFR · checks offline</small></div>`:'<small class="fp-mut">Tap a paper to show its QR.</small>'}</div>`},

call:{g:'Support',t:'Calling 717',m:'SUP-01 · SUP-02 · INT-07',n:'The free help line. The agent sees the caller’s owner number and open tickets, so the herder does not repeat details.',h:()=>`<div class="fp-call"><small>Calling · free</small><h2>717 SOMLITS Help Desk</h2><span class="fp-hico lg">${ic('headset',46)}</span><b class="fp-tmr">00:42</b><p>Hodan · Somali<br><small>Your owner number SL-07-0045128 is shown to the agent</small></p><div class="fp-cbtn">${[['mic','Mute'],['grid','Keypad'],['vol','Speaker']].map(x=>`<button><span>${ic(x[0],22)}</span>${x[1]}</button>`).join('')}</div><button class="fp-hang" data-go="help" aria-label="End call">${ic('phone',28)}</button></div>`},
chat:{g:'Support',t:'Live chat',m:'SUP-01 · SUP-02 · SUP-06 · FR-M13-17',n:'Chat with a help-desk agent in Somali or English. Photos and voice notes can be sent; the chat becomes a ticket if it needs a field visit.',h:()=>top('Hodan · Help desk',{right:`<button class="fp-ib" data-go="call" aria-label="Call">${ic('phone')}</button>`})+`<div class="fp-body fp-chatb"><div class="fp-live c"><i></i>Online · replies in about 2 min</div><div class="fp-chat"><p class="in">Salaan Cawo! Sideen kuu caawin karaa?<small>Hodan · 10:10</small></p><p class="out">Bar-cad’s tag fell off near the water point.<small>You · 10:11</small></p><p class="out">📷 photo<small>You · 10:11</small></p><p class="in">Thanks. I opened ticket HD-26-00417 and booked officer Maxamed for 4 Nov at Xiintoole camp. Keep Bar-cad at the camp.<small>Hodan · 10:12</small></p><p class="out">Mahadsanid!<small>You · 10:14</small></p></div><button class="fp-row" data-go="tkt"><span class="fp-ri">${ic('doc')}</span><span class="fp-rt"><b>Ticket HD-26-00417</b><small>Open · officer visit 4 Nov</small></span>${ic('chev',16)}</button><div class="fp-inbar"><button aria-label="Attach">${ic('cam',20)}</button><span>Type a message…</span><button aria-label="Voice">${ic('mic',20)}</button></div></div>`},
callback:{g:'Support',t:'Call me back',m:'SUP-01 · SUP-06',n:'For herders with little airtime or weak signal: the help desk calls them back at a chosen time.',h:()=>top('Call me back')+`<div class="fp-body">${f('Phone','+252 61 778 2041','✓')}<label class="fp-l">About</label><div class="fp-chips">${['Tag','Sale','Permit','Sick animal','Payment','Other'].map((c,i)=>`<button class="${i===0?'on':''}">${c}</button>`).join('')}</div><label class="fp-l">When</label><div class="fp-seg"><span class="on">As soon as possible</span><span>Morning</span><span>Evening</span></div><label class="fp-l">Language</label><div class="fp-seg"><span class="on">Somali</span><span>English</span></div><div class="fp-note">Calls back are free. If we miss you we try twice more and send an SMS.</div>${btn('Request call back','cbok')}</div>`},
cbok:{g:'Support',t:'Call back booked',m:'SUP-01',n:'Confirmation with the expected time; the request is logged as a ticket.',h:()=>top('Booked',{back:false})+`<div class="fp-body c"><div class="fp-ok">${ic('check',40)}</div><h2>We will call you</h2><p class="fp-mut">Within about 15 minutes, in Somali.</p><div class="fp-card"><div class="fp-kv"><span>Ticket</span><b class="mono">HD-26-00452</b></div><div class="fp-kv"><span>Phone</span><b>+252 61 778 2041</b></div></div>${btn('Back to help desk','help')}</div>`},

consent:{g:'Start',t:'Privacy & consent',m:'FR-M02-05 · SEC-04 · NFR-43 · FR-M02-22',n:'Shown once after the first sign-in, in Somali. Registration rests on the Veterinary Authority’s legal duty; only optional uses (insurance, market offers, research) need a yes.',h:()=>top('Your data')+`<div class="fp-body"><div class="fp-hero s">${ic('shield',28)}<b>How we use your information</b><small>Read aloud: tap ▶ to listen in Somali</small></div><div class="fp-card"><div class="fp-kv"><span>We keep</span><b>Name, phone, places, animals</b></div><div class="fp-kv"><span>Stored in</span><b>Somalia (MoLFR)</b></div><div class="fp-kv"><span>National ID</span><b>Number only, never biometrics</b></div><div class="fp-kv"><span>Shown to buyers abroad</span><b>Never</b></div></div><label class="fp-l">Optional · you can change these later</label>${tg('Share my animals with my insurer','Needed for livestock insurance',S.c1,'c1')}${tg('Market price SMS','Weekly prices for my district',S.c2,'c2')}${tg('Use my data for research','Anonymous, for planning only',S.c3,'c3')}${btn('I understand · continue','home')}</div>`},

ussd:{g:'Main',t:'USSD *717# (any phone)',m:'FR-M11-03 · FR-M04-10 · INT-07',n:'The same core services on a basic phone: check animals, holds and papers, report a sick animal with a count and signs, confirm a sale. Tap the options to walk through it.',h:()=>{const U={0:['SOMLITS',['1','Xoolahayga (My animals)',1],['2','Warbixi cudur (Report sickness)',2],['3','Waraaqaha (Papers)',3],['4','Iib xaqiiji (Confirm sale)',4],['0','Ka bax',0]],1:['Xoolahayga','Geel 2 · Lo 2 · Ari 83 · Ido 54','Xayiraad: Gaduud ilaa 3 Nof','Tallaal: CBPP 2 Nof (Bar-cad)',['0','Dib',0]],2:['Warbixi cudur · nooca',['1','Ari / ido',5],['2','Geel',5],['3','Lo',5],['0','Dib',0]],5:['Imisa iyo calaamad?','> 5, qufac',['1','Dir (Send)',6],['0','Dib',2]],6:['La diray','Warbixin DR-26-07-0913','Dhakhtarka degmada waa la ogeysiiyey; goobtaada waa la diray.',['0','Ku noqo',0]],3:['Waraaqaha','Kaarka: SL-07-0045128','PIN 0700405','Ogolaansho: MP-07-2026-001204 ilaa 9 Nof',['0','Dib',0]],4:['Iib xaqiiji','TR-26-0418 · 1 ari · USD 520',['1','Haa',7],['2','Maya',0]],7:['Mahadsanid','Iibka TR-26-0418 waa la xaqiijiyey.',['0','Ku noqo',0]]};const u=U[S.u||0];return top('*717#')+`<div class="fp-body c"><div class="fp-ussd"><b>${u[0]}</b>${u.slice(1).map(l=>Array.isArray(l)?`<button data-u="${l[2]}">${l[0]}. ${l[1]}</button>`:`<span>${l}</span>`).join('')}</div><small class="fp-mut">Works on any phone, no data needed. Menu text is a draft for native review.</small><div class="fp-card" style="text-align:left"><div class="fp-kv"><span>My animals</span><b>count + holds</b></div><div class="fp-kv"><span>Report sickness</span><b>type, count, signs, location</b></div><div class="fp-kv"><span>Papers</span><b>owner card, PIN, permits</b></div><div class="fp-kv"><span>Confirm sale</span><b>Yes / No</b></div></div></div>`}},
health:{g:'Herd',t:'Health & vaccines',m:'FR-M04-02 · FR-M04-06 · INT-16 · FR-M11-01',n:'The herd’s vaccine calendar, campaigns near the herder, and animals in a withdrawal period that cannot be sold or slaughtered yet.',h:()=>top('Health')+`<div class="fp-body"><div class="fp-card"><div class="fp-ch"><b>Herd vaccinated</b><span class="fp-chip g">139 / 141</span></div><div class="fp-bar"><i style="width:98%"></i></div></div><label class="fp-l">Coming up</label>${row('syr','CBPP campaign · camels','2 Nov · Xiintoole water point · free',null,'<span class="fp-pill fp-y">1 due</span>')}${row('syr','PPR booster · goats & sheep','Mar 2027 · officer will SMS',null,'<span class="fp-pill fp-m">Later</span>')}<label class="fp-l">Do not sell yet</label><button class="fp-alert r" data-an="2">${ic('alert')}<span><b>Gaduud · oxytetracycline</b><small>Treated 27 Oct · withdrawal ends 3 Nov</small></span>${ic('chev',16)}</button><label class="fp-l">Last 3 months</label><div class="fp-tl">${[['PPR · 82 goats, 54 sheep','12 Oct · Dr Abdi'],['FMD · 2 cattle','1 Oct · Dr Abdi'],['Deworming · whole herd','3 Sep · CAHW Faarax']].map(x=>`<div><i></i><span><b>${x[0]}</b><small>${x[1]}</small></span></div>`).join('')}</div>${btn('Report a sick animal','report','o')}</div>`},
birth:{g:'Herd',t:'Record a birth',m:'FR-M03-08 · FR-M03-15 · FR-M03-13',n:'Linked to the mother. The young animal stays Pending until an officer tags it at the next visit.',h:()=>top('New birth')+`<div class="fp-body"><label class="fp-l">Mother</label><div class="fp-an"><span class="fp-ava C">C</span><span class="fp-rt"><b>Hooyo-cas · Camel</b><small class="mono">706 0000 1234 3451</small></span>${ic('check',16)}</div><label class="fp-l">Young one</label><div class="fp-seg"><span class="on">Female</span><span>Male</span></div>${f('Born','29 Oct 2026')}${f('Where','Xiintoole camp · 0700405','GPS')}${f('Weight (optional)','38 kg')}<button class="fp-photo">${ic('cam',22)} Add photo</button><div class="fp-note">An officer will tag it at the next visit. Until then it shows as Pending in My animals.</div>${btn('Save birth','reqs')}</div>`},
perf:{g:'Herd',t:'Weights & milk',m:'FR-M03-15 · FR-M03-12',n:'Optional records the herder can keep, with a simple feedback chart and a one-line summary. Helps show value from the system.',h:()=>{const P={Milk:['Hooyo-cas · milk','Litres per day','6.4 L','+0.8 L','6.5 L','Your district average for camels this month is 5.1 L. You are above average.'],Weight:['Dibi-yar · weight','Weight (kg)','312 kg','+38 kg','318 kg','Three weights since June: growing about 0.4 kg a day, normal for a 2-year-old bull.'],'Body score':['Gaduud · body score','Body condition (1–5)','3.0','−0.5','3','Down since treatment. Give extra feed until the withdrawal period ends.']}[S.ptab];return top(P[0])+`<div class="fp-body"><div class="fp-seg">${['Milk','Weight','Body score'].map(k=>`<span data-ptab="${k}" class="${S.ptab===k?'on':''}">${k}</span>`).join('')}</div><div class="fp-card"><div class="fp-ch"><b>${P[1]}</b><span class="fp-chip ${P[3][0]==='+'?'g':''}">${P[3]}</span></div><b class="fp-big">${P[2]}</b>${spark}<div class="fp-mo"><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span></div></div><div class="fp-note">${P[5]}</div>${f('Today',P[4])}${btn('Save','perf')}</div>`}},
loss:{g:'Herd',t:'Animal died, lost or stolen',m:'FR-M03-08 · FR-M02-18 · FR-M01-06',n:'Removes the animal from the herd count. Theft alerts checkpoints and markets; a death with signs of disease also alerts the vet.',h:()=>top('Death or loss')+`<div class="fp-body"><div class="fp-grid2">${[['herd','Died',1],['alert','Lost / strayed'],['lock','Stolen'],['swap','Sold outside SOMLITS']].map(x=>`<button class="fp-tile ${x[2]?'on':''}">${ic(x[0],22)}${x[1]}</button>`).join('')}</div><label class="fp-l">Animal</label><div class="fp-an"><span class="fp-ava G">G</span><span class="fp-rt"><b>Goats (lot) · 3 of 82</b><small class="mono">GIN 07-0405-G2</small></span></div>${f('When','30 Oct')}<label class="fp-l">Was it sick before?</label><div class="fp-seg"><span class="on">Yes</span><span>No</span><span>Don’t know</span></div><div class="fp-note">Because they were sick, the district vet is told too. Tags of dead animals are retired.</div>${btn('Send','reportok')}</div>`},
tagloss:{g:'Herd',t:'Replace a lost tag',m:'FR-M01-06 · FR-M13-17',n:'The animal keeps its record. The officer applies a new tag and the old number is linked to the new one.',h:()=>top('Lost tag')+`<div class="fp-body"><label class="fp-l">Which animal?</label><div class="fp-an"><span class="fp-ava C">C</span><span class="fp-rt"><b>Bar-cad · Camel</b><small class="mono">706 0000 1234 3452</small></span>${ic('check',16)}</div><label class="fp-l">What happened</label><div class="fp-seg"><span class="on">Fell off</span><span>Broken</span><span>Can’t be read</span></div>${f('Last seen with tag','20 Oct')}<div class="fp-note">Keep the animal at the camp. An officer will scan its other marks and put on a new tag (fee may apply).</div>${btn('Ask for a new tag','reqs')}</div>`},
keepers:{g:'Herd',t:'Keepers & community',m:'FR-M02-20 · FR-M02-10 · FR-M02-15',n:'Owners and keepers are different: a son may herd the camels, a community may share a well. Each animal records both.',h:()=>top('Who looks after my animals')+`<div class="fp-body">${[['CJ','Cawo Jaamac','Owner · you','g','Owner'],['AJ','Axmed Jaamac','Keeps the camels · Xiintoole','y','Keeper'],['XB','Xiintoole Bari community','Shares water point 0700398','m','Group']].map(x=>`<div class="fp-row"><span class="fp-av">${x[0]}</span><span class="fp-rt"><b>${x[1]}</b><small>${x[2]}</small></span><span class="fp-pill fp-${x[3]}">${x[4]}</span></div>`).join('')}${f('Add a keeper · phone','+252 61 ...')}<div class="fp-note">A keeper can show papers and report problems, but only the owner can sell.</div>${btn('Add keeper','keepers')}</div>`},
places:{g:'Herd',t:'My places',m:'FR-M02-03 · FR-M02-17 · FR-M03-13',n:'The homestead and the seasonal camps and water points the herd uses. No fixed address is needed.',h:()=>top('My places',{right:`<button class="fp-ib" data-go="place" aria-label="Add">${ic('plus')}</button>`})+`<div class="fp-body"><div class="fp-map">${ic('pin',26)}<span class="a">Homestead</span><span class="b">Camp · now</span><svg viewBox="0 0 300 140"><path d="M60 100 C120 40, 180 120, 240 50" stroke="#2F6BFF" stroke-width="3" fill="none" stroke-dasharray="6 6"/></svg></div>${[['pin','Homestead · Beledweyne','PIN 0700405 · all year','g','Approved'],['route','Dry-season camp, Xiintoole','PIN 0700412 · Dec–Mar · herd here now','g','Approved'],['pin','Buuqo water point','PIN 0700398 · shared','m','Shared'],['route','Wet-season grazing, Ceel Jaale','Sent 30 Oct','y','Pending']].map(x=>`<div class="fp-row"><span class="fp-ri">${ic(x[0])}</span><span class="fp-rt"><b>${x[1]}</b><small>${x[2]}</small></span><span class="fp-pill fp-${x[3]}">${x[4]}</span></div>`).join('')}</div>`},
permit:{g:'Trade',t:'Ask for a movement permit',m:'FR-M05-02 · FR-M05-03 · FR-M05-13 · FR-M05-14 · FR-M05-11',n:'Needed to leave the district, go to a market in another region or to export. Animals with a hold, withdrawal or missing vaccine cannot be added.',h:()=>top('Movement permit')+`<div class="fp-body"><label class="fp-l">Why</label><div class="fp-seg"><span class="on">Market</span><span>Grazing</span><span>Slaughter</span><span>Export</span></div>${f('From','Xiintoole camp · 0700412')}${f('To','Galkacyo livestock market · 1200031','other region')}${f('Date','6 Nov 2026')}${f('Transport','Truck SL-AB-4412 · Cabdi Transport','registered')}<label class="fp-l">Animals</label>${AN.slice(0,4).map((a,i)=>{const b=a.st==='treat'||a.st==='due';return `<button class="fp-an ${b?'dis':''}" data-ppick="${i}"><span class="fp-ck ${S.psel.has(i)&&!b?'on':''}">${S.psel.has(i)&&!b?ic('check',14):''}</span><span class="fp-rt"><b>${a.nm} · ${a.sp}</b><small class="mono">${a.a}</small></span>${b?`<span class="fp-pill fp-r">${a.st==='treat'?'Withdrawal':'Vaccine due'}</span>`:''}</button>`}).join('')}<div class="fp-an dis"><span class="fp-ck"></span><span class="fp-rt"><b>14 goats · request</b><small>Not yet verified by an officer</small></span><span class="fp-pill fp-y">Pending</span></div><div class="fp-note">Pending animals cannot get a permit until an officer verifies them. A district officer checks and signs. Fee: USD 2, paid by EVC Plus or e-Dahab.</div>${btn('Send request','pay')}</div>`},
permitok:{g:'Trade',t:'Permit issued',m:'FR-M05-02 · FR-M05-05 · FR-M05-12',n:'Signed by the district office. Checkpoints scan the QR offline; it is only valid for the dates shown.',h:()=>top('Permit',{back:false})+`<div class="fp-body c"><div class="fp-card c">${qr(77)}<b class="mono">MP-07-2026-001204</b><small class="fp-mut">Signed by Beledweyne district office</small></div><div class="fp-card"><div class="fp-kv"><span>Animals</span><b>${[...S.psel].filter(i=>!['treat','due'].includes(AN[i].st)).length} · listed by tag</b></div><div class="fp-kv"><span>Route</span><b>Xiintoole → Galkacyo</b></div><div class="fp-kv"><span>Valid</span><b>6 – 9 Nov 2026</b></div><div class="fp-kv"><span>Purpose</span><b>Market</b></div></div><div class="fp-note">Show this at each checkpoint. The market scans the animals in on arrival.</div>${btn('Saved to My papers','papers','o')}${btn('Back home','home')}</div>`},
market:{g:'Trade',t:'Market prices',m:'FR-M05-08 · INT-04',n:'Prices and volumes from market sales recorded in SOMLITS, shared with the LMIS. Helps herders decide when and where to sell.',h:()=>top('Market prices')+`<div class="fp-body"><div class="fp-chips">${['Goat','Sheep','Camel','Cattle'].map((c,i)=>`<button class="${i===0?'on':''}">${c}</button>`).join('')}</div><div class="fp-card"><div class="fp-ch"><b>Goat · Beledweyne east</b><span class="fp-chip g">+6%</span></div><b class="fp-big">USD 52</b>${spark}<div class="fp-mo"><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span></div></div>${[['Galkacyo','USD 58 · 1,240 sold this week','g','+9%'],['Beledweyne east','USD 52 · 860 sold','g','+6%'],['Burao','USD 55 · 2,110 sold','m','0%'],['Berbera export pens','USD 64 · Saudi buyers','g','+4%']].map(x=>`<div class="fp-row"><span class="fp-ri">${ic('pin')}</span><span class="fp-rt"><b>${x[0]}</b><small>${x[1]}</small></span><span class="fp-pill fp-${x[2]}">${x[3]}</span></div>`).join('')}<small class="fp-mut">Updated nightly · average price per head</small></div>`},
trades:{g:'Trade',t:'Buys & sales',m:'FR-M05-06 · FR-M05-15 · FR-M05-16',n:'Every ownership change the herder made or received, with its reference. Proof of ownership if there is a dispute.',h:()=>top('Buys & sales')+`<div class="fp-body"><div class="fp-seg"><span class="on">All</span><span>Sold</span><span>Bought</span><span>Gifts</span></div>${[['swap','Sold 1 goat · Xasan M. N.','TR-26-0418 · 31 Oct · waiting for buyer','y','Waiting','buyer'],['swap','Sold 1 goat · Xasan M. N.','TR-26-0412 · 26 Oct · USD 520','g','Done','journey'],['herd','Bought 20 goats · Galkacyo market','TR-26-0233 · 2 Aug · USD 960','g','Done',null],['user','Gift: 2 camels from Jaamac C.','TR-25-1190 · inheritance · 2025','g','Done',null]].map(x=>row(x[0],x[1],x[2],x[5],`<span class="fp-pill fp-${x[3]}">${x[4]}</span>`)).join('')}</div>`},
pay:{g:'Money',t:'Fees & payments',m:'FR-M13-18 · INT-17 · INT-08 · INT-18',n:'Service fees (tags, permits, certificates) are paid by mobile money through SIPS. The receipt is in the app and by SMS.',h:()=>top('Pay a fee')+`<div class="fp-body"><div class="fp-bal sm"><small>To pay</small><b>USD 2.00</b><div class="fp-bal-r"><span>Movement permit · MP request</span></div></div><label class="fp-l">Pay with</label><div class="fp-grid2">${[['EVC Plus',1],['e-Dahab'],['Sahal'],['SOMQR']].map(x=>`<button class="fp-tile ${x[1]?'on':''}">${ic('pay',22)}${x[0]}</button>`).join('')}</div>${f('Phone','+252 61 778 2041')}<label class="fp-l">Earlier</label>${row('check','Replacement tag · Bar-cad','USD 1.50 · 22 Oct · RC-26-30411',null,'<span class="fp-pill fp-g">Paid</span>')}${row('check','Premises certificate','USD 0 · free in pilot',null,'<span class="fp-pill fp-g">Free</span>')}<div class="fp-note">Fee amounts are placeholders until MoLFR sets them.</div>${btn('Pay USD 2.00','payok')}</div>`},
payok:{g:'Money',t:'Payment done',m:'FR-M13-18 · INT-17',n:'Payment confirmed by the operator; the request goes to the officer queue.',h:()=>top('Paid',{back:false})+`<div class="fp-body c"><div class="fp-ok">${ic('check',40)}</div><h2>USD 2.00 paid</h2><p class="fp-mut">Your permit request is with the district officer. You will get an SMS when it is signed.</p><div class="fp-card"><div class="fp-kv"><span>Receipt</span><b class="mono">RC-26-30588</b></div><div class="fp-kv"><span>Via</span><b>EVC Plus · SIPS</b></div></div>${btn('See the permit (when signed)','permitok','o')}${btn('Back home','home')}</div>`},
insure:{g:'Money',t:'Livestock insurance',m:'INT-08 · SEC-04 · FR-M02-05',n:'Optional. With the herder’s consent, insured animal IDs are shared with the insurer, and deaths recorded in SOMLITS speed up claims.',h:()=>top('Insurance')+`<div class="fp-body"><div class="fp-hero s">${ic('shield',28)}<b>Protect your herd against drought</b><small>Index insurance through partner insurers</small></div><div class="fp-card"><div class="fp-kv"><span>Animals covered</span><b>2 camels, 2 cattle</b></div><div class="fp-kv"><span>Season</span><b>Oct 2026 – Mar 2027</b></div><div class="fp-kv"><span>Premium</span><b>USD 18 (placeholder)</b></div></div>${tg('Share my animal IDs with the insurer','Needed. You can stop any time.',S.c1,'c1')}${row('doc','Make a claim','Uses the death records already in SOMLITS','loss')}${btn('Get cover','pay')}</div>`},
ticket:{g:'Support',t:'New help ticket',m:'FR-M13-17 · SUP-01 · SUP-06',n:'Same ticket number on phone, SMS, chat and the 717 call centre. Field problems are passed to the AHDAA field officer.',h:()=>top('New ticket')+`<div class="fp-body"><label class="fp-l">About</label><div class="fp-chips">${['Tag','Sale','Permit','Payment','App','Other'].map((c,i)=>`<button class="${i===0?'on':''}">${c}</button>`).join('')}</div>${f('Animal (optional)','Bar-cad · 706 …3452')}<label class="fp-l">Tell us</label><div class="fp-in tall"><span>Tag fell off near the water point. Need a new one.</span></div><button class="fp-photo">${ic('cam',22)} Add photo or voice note</button>${btn('Send','tkt')}</div>`},
tkt:{g:'Support',t:'Ticket status',m:'FR-M13-17 · SUP-01 · SUP-02',n:'The ticket number arrives by SMS at once and is the same whether the herder calls, chats or uses the app. Each step is shown until it is solved.',h:()=>top('HD-26-00417')+`<div class="fp-body"><div class="fp-hero y">${ic('chat',28)}<b>Tag fell off · Bar-cad</b><small>Open · Major · reply within 1 business day</small></div><div class="fp-chat"><p class="in">SOMLITS: Tikidkaaga HD-26-00417 waa la diiwaangeliyey. Ku raadi app-ka ama wac 717.<small>SMS · 31 Oct 10:05</small></p></div><div class="fp-tl">${[['Ticket opened','31 Oct 10:05 · from the app',1],['Help desk replied','31 Oct 10:12 · in Somali',1],['Field officer assigned','Maxamed C. · AHDAA',1],['Officer visit','4 Nov · Xiintoole camp',0],['Solved and closed','you will be asked to rate it',0]].map(x=>`<div class="${x[2]?'':'off'}"><i></i><span><b>${x[0]}</b><small>${x[1]}</small></span></div>`).join('')}</div><div class="fp-chat"><p class="in">Salaan Cawo, waxaan ku soo dirnay sarkaal 4 Nov.<small>Help desk · 10:12</small></p><p class="out">Mahadsanid!<small>You · 10:14</small></p></div>${btn('Reply','tkt','o')}</div>`},
learn:{g:'Support',t:'Learn',m:'TRN-09 · TRN-05',n:'Short audio and video guides in Somali on why animals are tagged, rules and benefits, played offline once downloaded.',h:()=>top('Learn')+`<div class="fp-body">${[['play','Why every animal has a tag','2 min · audio · Somali','Saved'],['play','How to sell safely with the app','3 min · video','Saved'],['play','What a standstill means for you','2 min · audio','New'],['play','Getting a movement permit','3 min · video',''],['help','Questions people ask','12 answers','']].map((x,i)=>`<button class="fp-row" data-play="${i}"><span class="fp-ri">${ic(x[0])}</span><span class="fp-rt"><b>${x[1]}</b><small>${x[2]}</small></span>${S.play===i?'<span class="fp-pill fp-g">▶ Playing</span>':x[3]?`<span class="fp-chip">${x[3]}</span>`:''}</button>`).join('')}<div class="fp-note">Ask your community animal health worker for a group session.</div></div>`},
mydata:{g:'Support',t:'My data',m:'FR-M13-07 · FR-M02-22 · NFR-43 · SEC-04',n:'The herder can see what is held, ask to correct it, download a copy, and change optional consents.',h:()=>top('My data')+`<div class="fp-body"><div class="fp-card"><div class="fp-kv"><span>Name</span><b>Cawo Jaamac</b></div><div class="fp-kv"><span>Phone</span><b>+252 61 778 2041</b></div><div class="fp-kv"><span>National ID</span><b>Verified · number only</b></div><div class="fp-kv"><span>Places</span><b>4</b></div><div class="fp-kv"><span>Who saw my record</span><b>3 officers this year</b></div></div>${row('doc','Ask to correct something','Goes to the district office','ticket')}${row('qr','Download my data','PDF in Somali or English',null)}${row('shield','Consents','Insurance on · prices on · research off','consent')}</div>`}
};
function f(l,v,r){return `<label class="fp-l">${l}</label><div class="fp-in"><span>${v}</span>${r?`<em>${r}</em>`:''}</div>`;}
const GROUPS=[...new Set(Object.values(SCR).map(s=>s.g))];
root.innerHTML=`<style>
#fpBox .fp-wrap{display:grid;grid-template-columns:220px minmax(0,auto) minmax(0,1fr);gap:28px;align-items:start}
#fpBox .fp-pick{display:flex;flex-direction:column;gap:12px;position:sticky;top:70px}#fpBox .fp-pick h4{margin:0;font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#fpBox .fp-pick div{display:flex;flex-direction:column;gap:2px}#fpBox .fp-pick button{all:unset;cursor:pointer;padding:6px 10px;border-radius:7px;font-size:14px;color:var(--ink)}#fpBox .fp-pick button:hover{background:var(--sunk)}#fpBox .fp-pick button.on{background:var(--flag);color:#fff}
#fpBox .fp-side{display:flex;flex-direction:column;gap:14px;position:sticky;top:70px}#fpBox .fp-side .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.fp-dev{width:380px;max-width:100%;height:780px;border-radius:46px;padding:12px;background:#0B1220;box-shadow:0 30px 60px -20px rgba(20,40,90,.45);position:relative}
.fp-phone{--b:#2F6BFF;--b2:#1846D8;--bg:#F3F6FC;--card:#fff;--ink:#0F1A33;--mut:#6B7690;--ln:#E3E8F3;--soft:#E9F0FF;--g:#12A36B;--gs:#E2F6EC;--y:#C98500;--ys:#FFF3D6;--r:#E0434B;--rs:#FDE6E7;
 width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);position:relative;display:flex;flex-direction:column}
.fp-phone.dk{--bg:#0C1324;--card:#151F38;--ink:#EEF2FB;--mut:#93A0BF;--ln:#24304F;--soft:#1C2A4D;--gs:#123A2A;--ys:#3A2E10;--rs:#3D1A1F}
.fp-phone *{box-sizing:border-box}.fp-phone :where(button){font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left}
.fp-bal.sm>b{font-size:22px}
.fp-sb{display:flex;justify-content:space-between;padding:12px 26px 4px;font:600 13px/1 var(--f-body);flex:none}.fp-sb span:last-child{letter-spacing:2px}
.fp-scr{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}.fp-scr::-webkit-scrollbar{display:none}

<p class="lead" style="font-size:17px">A working mock-up of the herder’s app in the branded SOMLITS style: logo and language switch on Home, four coloured number tiles, coloured quick actions, a “My hub” grid, white cards on a soft blue background and a docked bottom bar. Photo areas are placeholders until real field photos are supplied. Tap through it like a real phone: sign in and give consent, check the herd and each animal’s health, moves and records, record a birth or a death, sell a goat and watch the buyer confirm, ask for a movement permit and pay the fee by mobile money, check market prices, report a sick animal, move camp, manage places and keepers, show papers as a QR, work offline, use USSD on a basic phone, and get help. Switch Somali or English and dark mode in Profile. Every screen traces to the F screens further down this tab and to BRS requirements.</p>
